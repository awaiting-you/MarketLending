:root{
  --base:#08090d; --surface:#101319; --line:#272d38; --line-soft:#1b2029;
  --fg:#eef2f6; --muted:#98a2b0; --dim:#6a7482; --ink:#0b0d12;
  --accent:#cbf94d; --accent-soft:#e4ff96; --cyan:#3ddcff;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--base)}

.cover{
  position:relative;width:600px;height:600px;overflow:hidden;
  background:var(--base);color:var(--fg);
  font-family:"Manrope",system-ui,sans-serif;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:54px 56px;
}

/* сетка */
.grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--line-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(120% 95% at 50% 45%,#000 25%,transparent 78%);
  mask-image:radial-gradient(120% 95% at 50% 45%,#000 25%,transparent 78%);
  opacity:.85;
}
.glow{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
.glow-lime{width:460px;height:460px;top:-190px;left:-170px;background:radial-gradient(circle,rgba(203,249,77,.30),transparent 68%)}
.glow-cyan{width:420px;height:420px;right:-190px;bottom:-180px;background:radial-gradient(circle,rgba(61,220,255,.20),transparent 68%)}
.glow-core{width:360px;height:260px;left:120px;top:200px;background:radial-gradient(circle,rgba(203,249,77,.16),transparent 70%)}

.row{position:relative;display:flex;align-items:center;gap:18px}
.mark{
  width:72px;height:72px;border-radius:20px;background:var(--accent);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-family:"Onest",sans-serif;font-weight:800;font-size:34px;line-height:1;
  letter-spacing:-2px;padding-bottom:4px;
  box-shadow:0 0 44px rgba(203,249,77,.35);
}
.topline{display:flex;flex-direction:column;gap:5px}
.topline b{font-family:"Onest",sans-serif;font-weight:700;font-size:19px;letter-spacing:.5px;color:var(--fg)}
.topline span{font-size:13px;letter-spacing:4.5px;color:var(--dim);text-transform:uppercase;font-weight:500}

.middle{position:relative;display:flex;flex-direction:column;gap:26px}
h1{
  font-family:"Onest",sans-serif;font-weight:800;font-size:126px;line-height:.86;
  letter-spacing:-7px;color:var(--fg);
  text-shadow:0 0 70px rgba(203,249,77,.20);
}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--accent-soft) 0%,var(--accent) 45%,var(--cyan) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:92px;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--cyan))}
.tagline{font-size:24px;line-height:1.35;font-weight:500;color:var(--muted);max-width:430px}

.bottom{position:relative;display:flex;flex-direction:column;gap:22px}
.chips{display:flex;gap:10px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:10px 20px;
  font-size:16px;font-weight:600;color:var(--muted);background:rgba(16,19,25,.6);
}
.chip:first-child{color:var(--ink);background:var(--accent);border-color:var(--accent)}
.foot{display:flex;align-items:center;justify-content:space-between;font-size:16px;color:var(--dim);font-weight:600}
.foot b{color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="cover">
  <div class="grid"></div>
  <div class="glow glow-lime"></div>
  <div class="glow glow-cyan"></div>
  <div class="glow glow-core"></div>

  <div class="row">
    <div class="mark">&gt;&gt;</div>
    <div class="topline">
      <b>СДВИГ</b>
      <span>Marketing agency</span>
    </div>
